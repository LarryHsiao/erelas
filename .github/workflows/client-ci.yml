name: client-ci

# Analyse and test the Flutter client on macOS and Windows, and compile the
# Windows runner. Keep flutter-version in step with .fvmrc.
on:
  push:
    paths:
      - "lib/**"
      - "test/**"
      - "assets/**"
      - "macos/**"
      - "windows/**"
      - "pubspec.*"
      - ".github/workflows/client-ci.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Third-party action, pinned to a commit (v2 as of 2026-11-04).
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Compile the Windows runner
        if: runner.os == 'Windows'
        run: flutter build windows --debug
